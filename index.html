<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Loopline — one-stroke puzzle</title>
    <meta
      name="description"
      content="Draw every line in one unbroken stroke. A minimalist Eulerian-path puzzle for the browser."
    />
    <meta name="theme-color" id="meta-theme-color" content="#05060b" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="mobile-web-app-capable" content="yes" />
    <script>
      /* Resolve the theme before first paint so a stored preference never
         flashes the wrong palette. Deliberately inline and dependency-free. */
      (function () {
        try {
          var raw = localStorage.getItem('loopline:v1');
          var pref = raw ? JSON.parse(raw).theme || 'auto' : 'auto';
          var light =
            pref === 'light' ||
            (pref !== 'dark' && window.matchMedia('(prefers-color-scheme: light)').matches);
          document.documentElement.dataset.theme = light ? 'light' : 'dark';
          document.getElementById('meta-theme-color').content = light ? '#f4f5fa' : '#05060b';
        } catch (error) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div class="app">
      <header class="hud">
        <div class="hud__brand">
          <!-- The same L as the app icon and the favicon, reduced to a
               single-colour glyph: this one inherits `currentColor` so it
               follows the accent through a theme change. The trail's three
               stops and the flare cannot survive that, so only the shape and
               the endpoint dot carry over. -->
          <svg class="hud__mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              d="M8 6 L8 18 L16 18"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <circle cx="16" cy="18" r="1.9" fill="currentColor" />
          </svg>
          <span class="hud__name" data-text="brand">Loopline</span>
        </div>

        <div class="hud__stats">
          <div class="stat">
            <span class="stat__label" data-text="level">Level</span>
            <span class="stat__value" id="stat-level">1</span>
          </div>
          <div class="stat">
            <span class="stat__label" data-text="time">Time</span>
            <span class="stat__value stat__value--num" id="stat-time">0.0</span>
          </div>
          <div class="stat">
            <span class="stat__label" data-text="best">Best</span>
            <span class="stat__value stat__value--num" id="stat-best">—</span>
          </div>
        </div>

        <div class="hud__actions">
          <button class="pill" id="btn-lang" type="button">EN</button>
          <button class="pill pill--icon" id="btn-theme" type="button">
            <svg id="icon-auto" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <circle
                cx="12"
                cy="12"
                r="8.4"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              />
              <path d="M12 3.6v16.8a8.4 8.4 0 0 0 0-16.8Z" fill="currentColor" />
            </svg>
            <svg id="icon-dark" viewBox="0 0 24 24" aria-hidden="true" focusable="false" hidden>
              <path
                d="M20 14.2A8.4 8.4 0 0 1 9.8 4a8.5 8.5 0 1 0 10.2 10.2Z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linejoin="round"
              />
            </svg>
            <svg id="icon-light" viewBox="0 0 24 24" aria-hidden="true" focusable="false" hidden>
              <circle
                cx="12"
                cy="12"
                r="4.1"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              />
              <path
                d="M12 2.7v2.1M12 19.2v2.1M4.3 12H2.2M21.8 12h-2.1M6.6 6.6 5.1 5.1M18.9 18.9l-1.5-1.5M17.4 6.6l1.5-1.5M5.1 18.9l1.5-1.5"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
          </button>
          <button class="pill pill--icon" id="btn-help" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                d="M9.2 9a2.9 2.9 0 1 1 3.8 2.8c-.8.3-1 .9-1 1.7v.4"
                fill="none"
                stroke="currentColor"
                stroke-width="1.9"
                stroke-linecap="round"
              />
              <circle cx="12" cy="17.4" r="1.15" fill="currentColor" />
            </svg>
          </button>
        </div>
      </header>

      <main class="board" id="board" tabindex="0" role="application">
        <canvas id="canvas"></canvas>
        <div
          class="progress"
          id="progress"
          role="progressbar"
          aria-valuemin="0"
          aria-valuemax="1"
          aria-valuenow="0"
        >
          <span class="progress__track"
            ><span class="progress__fill" id="progress-fill"></span
          ></span>
          <span class="progress__count" id="progress-value">0/1</span>
        </div>
      </main>

      <footer class="dock" id="dock">
        <button class="btn btn--ghost" id="btn-levels" type="button">Levels</button>
      </footer>
    </div>

    <div class="overlay" id="overlay" hidden>
      <div class="overlay__card" id="overlay-card">
        <p class="overlay__eyebrow" id="overlay-eyebrow"></p>
        <h2 class="overlay__title" id="overlay-title"></h2>
        <p class="overlay__body" id="overlay-body"></p>
        <ol class="steps" id="overlay-steps" hidden>
          <li id="overlay-step-1"></li>
          <li id="overlay-step-2"></li>
          <li id="overlay-step-3"></li>
        </ol>
        <div class="levels" id="overlay-levels" hidden></div>
        <p class="overlay__time" id="overlay-time" hidden></p>
        <button class="btn btn--primary" id="overlay-action" type="button"></button>
        <button class="btn btn--quiet" id="overlay-secondary" type="button" hidden></button>
        <p class="overlay__hint" id="overlay-hint"></p>
      </div>
    </div>

    <p class="sr-only" id="live" aria-live="polite" role="status"></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
