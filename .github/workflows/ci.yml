name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job id is the status-check context required by the ruleset on `main`.
  # Renaming it means updating the ruleset too.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Same order as `npm run verify`, split into steps so a failure names
      # itself in the checks UI instead of hiding behind one red cross.
      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Report bundle size
        run: |
          {
            echo '### Bundle'
            echo
            echo '```'
            ls -lh dist/assets/*.js dist/assets/*.css | awk '{print $9, $5}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
